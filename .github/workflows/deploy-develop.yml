name: Deploy Develop Frontend

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-develop-frontend
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build frontend dist
        run: |
          rm -rf dist
          npm run build -- --mode development

  deploy:
    runs-on: vps-energi-fe
    needs: build

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build frontend dist
        run: |
          rm -rf dist
          npm run build -- --mode development

      - name: Prune old Podman images
        run: podman image prune -f --filter until=24h

      - name: Backup current Podman container
        run: |
          set -euo pipefail

          backup_container='energi-fe-dev-backup'

          if podman container exists 'energi-fe-dev'; then
            if podman container exists "$backup_container"; then
              echo "Removing existing backup container $backup_container before creating a fresh one"
              podman rm -f "$backup_container" || true
            fi

            echo "Creating backup container $backup_container from current image"
            current_image_id=$(podman inspect --format '{{.Image}}' energi-fe-dev 2>/dev/null || true)
            if [ -n "$current_image_id" ]; then
              podman create --name "$backup_container" "$current_image_id" || true
              echo "Backup created: $backup_container (status should be 'Created')"
            else
              echo "Unable to determine current image id for energi-fe-dev; skipping backup creation"
            fi
          else
            echo "No existing container to backup."
          fi

      - name: Build container image
        run: podman build -f dockerfile.development -t energi-fe:dev .

      - name: Remove existing container
        run: |
          if podman ps -a --format '{{.Names}}' | grep -qx 'energi-fe-dev'; then
            podman rm -f energi-fe-dev
          fi

      - name: Run container
        run: |
          podman run -d \
            --name energi-fe-dev \
            --network host \
            -e PORT=10001 \
            -e HOST=0.0.0.0 \
            energi-fe:dev
