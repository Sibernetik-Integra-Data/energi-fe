name: Deploy Develop Frontend

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-develop-frontend
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build frontend dist
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist

  deploy:
    runs-on: energi-fe
    needs: build

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Prune old Podman images
        run: podman image prune -f --filter until=24h

      - name: Backup current Podman image or container
        run: |
          set -euo pipefail

          backup_image='energi-fe:backup'

          if podman ps -a --format '{{.Names}}' | grep -qx 'energi-fe-dev'; then
            podman image exists "$backup_image" && podman rmi -f "$backup_image"
            podman commit energi-fe-dev "$backup_image"
          elif podman image exists 'energi-fe:dev'; then
            podman image exists "$backup_image" && podman rmi -f "$backup_image"
            podman tag 'energi-fe:dev' "$backup_image"
          fi

      - name: Build container image
        run: podman build -f dockerfile.development -t energi-fe:dev .

      - name: Remove existing container
        run: |
          if podman ps -a --format '{{.Names}}' | grep -qx 'energi-fe-dev'; then
            podman rm -f energi-fe-dev
          fi

          if podman ps -a --format '{{.Names}}' | grep -qx 'energi-fe-forwarder'; then
            podman rm -f energi-fe-forwarder
          fi

      - name: Run container
        run: |
          podman run -d \
            --name energi-fe-dev \
            -p 127.0.0.1:11001:10001 \
            -e NODE_ENV=development \
            -e PORT=10001 \
            -e HOST=0.0.0.0 \
            -e DIST_DIR=/app/dist \
            energi-fe:dev

      - name: Start Node forwarder
        run: |
          podman run -d \
            --name energi-fe-forwarder \
            --network host \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            node:22-alpine \
            node scripts/start-port-forward.js \
              --listen-host 0.0.0.0 \
              --listen-port 10001 \
              --target-host 127.0.0.1 \
              --target-port 11001

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            response="$(
              {
                exec 3<>/dev/tcp/127.0.0.1/10001
                printf 'GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
                head -n 1 <&3
              } 2>/dev/null
            )"

            if [[ "$response" == HTTP/*200* ]]; then
              exit 0
            fi

            sleep 3
          done

          echo "Container did not become ready in time"
          podman logs energi-fe-dev
          exit 1

      - name: Cleanup
        if: failure()
        run: podman rm -f energi-fe-forwarder energi-fe-dev || true